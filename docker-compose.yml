# Starts MariaDB with the OpenFlights data already loaded.
#
#     docker compose up --wait
#     docker compose exec mariadb mariadb flightdb2
#
# The data is loaded once, when the volume is first created. To reload from
# scratch, remove the volume as well:
#
#     docker compose down -v
#
services:
  mariadb:
    image: mariadb:${MARIADB_VERSION:-lts}
    container_name: openflights-mariadb
    environment:
      # Local development only. Also read by docker/init.sh.
      MARIADB_ROOT_PASSWORD: flightpw
    ports:
      # Override if 3306 is already taken, e.g. MARIADB_PORT=3307
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - ./data:/openflights/data:ro
      - ./sql:/openflights/sql:ro
      - ./docker/init.sh:/docker-entrypoint-initdb.d/10-load-openflights.sh:ro
      - openflights-data:/var/lib/mysql
    healthcheck:
      # Lets `docker compose up --wait` block until the data is actually loaded.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

volumes:
  openflights-data:
